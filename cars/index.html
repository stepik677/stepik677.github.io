<body>
<noscript><div style="padding:24px;font:18px sans-serif;color:#fff;background:#151c26">

  const T = 64, STEP = 15, NB = 7;           // клетка, шаг дорог (8 клеток дорога + 7 квартал), кварталов на сторону
  const ROAD_W = 8 * T;                      // ширина дороги: 8 полос
  const WORLD = NB * STEP * T + ROAD_W;      // 7232
  const BS = 7 * T;                          // размер квартала
  const SW = 22;                             // тротуар
  const LS = BS - 2 * SW;
  const CR = 96;                             // радиус скругления углов кварталов (плавные повороты)                    // участок внутри квартала
  const CH = 1300;                           // «высота камеры» для перспективы
  const SUNX = 0.5, SUNY = 0.38;             // направление теней
  const roadPos = k => k * STEP * T;
  // Точка попадает в срезанный угол квартала (там теперь асфальт)
  function inCornerCut(x, y, margin = 0) {
    const lx = x % (STEP * T) - ROAD_W, ly = y % (STEP * T) - ROAD_W;
    if (lx < 0 || ly < 0 || x < 0 || y < 0) return false;
    const cx = lx < CR ? CR : lx > BS - CR ? BS - CR : null;
    const cy = ly < CR ? CR : ly > BS - CR ? BS - CR : null;
    if (cx === null || cy === null) return false;
    return Math.hypot(lx - cx, ly - cy) > CR - margin;
  }

  let seed = 20261119;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const rr = (a, b) => a + rnd() * (b - a);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (f < 1) { r *= f; g *= f; b *= f; }
    else { const k = f - 1; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  // ================== Текстуры ==================
  function makePattern(size, draw) {
    const c = document.createElement('canvas');
    c.width = c.height = size * 2;
    const g = c.getContext('2d');
    g.scale(2, 2);
    draw(g, size);
    const p = ctx.createPattern(c, 'repeat');
    p.setTransform(new DOMMatrix().scale(0.5));
    return p;
  }
  const R = Math.random;
  function speckle(g, s, n, colors, size = 1.2) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = colors[(R() * colors.length) | 0];
      g.fillRect(R() * s, R() * s, size, size);
    }
  }
  const PAT = {
    grass: makePattern(256, (g, s) => {
      g.fillStyle = '#5c9a3f'; g.fillRect(0, 0, s, s);
      for (let i = 0; i < 14; i++) {
        const x = R() * s, y = R() * s, r = 20 + R() * 40;
        for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) {
          const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
          const c = R() < .5 ? 'rgba(40,90,25,.18)' : 'rgba(150,200,90,.12)';
          gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = gr; g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
        }
      }
      g.lineWidth = 1;
      for (let i = 0; i < 2600; i++) {
        const x = R() * s, y = R() * s;
        g.strokeStyle = ['#4a8a32', '#6fb04c', '#3f7a2b', '#7cbc58', '#558f3a'][(R() * 5) | 0];
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 3, y - 2 - R() * 3); g.stroke();
      }
      for (let i = 0; i < 25; i++) { // цветочки
        g.fillStyle = ['#fff', '#ffe066', '#f7a1c4'][(R() * 3) | 0];
        g.beginPath(); g.arc(R() * s, R() * s, 1.3, 0, 7); g.fill();
      }
    }),
    darkGrass: makePattern(256, (g, s) => {
      g.fillStyle = '#3b6f2b'; g.fillRect(0, 0, s, s);
      speckle(g, s, 3000, ['#2f5f22', '#467d33', '#335f26'], 2);
    }),
    asphalt: makePattern(256, (g, s) => {
      g.fillStyle = '#44464c'; g.fillRect(0, 0, s, s);
      speckle(g, s, 9000, ['#3a3c41', '#505259', '#585a61', '#2f3135'], 1.3);
      g.strokeStyle = 'rgba(20,20,22,.35)'; g.lineWidth = 1;
      for (let i = 0; i < 3; i++) { // трещины
        let x = R() * s, y = R() * s; g.beginPath(); g.moveTo(x, y);
        for (let k = 0; k < 6; k++) { x += (R() - .5) * 14; y += (R() - .5) * 14; g.lineTo(x, y); }
        g.stroke();
      }
    }),
    lot: makePattern(256, (g, s) => {
      g.fillStyle = '#55575d'; g.fillRect(0, 0, s, s);
      speckle(g, s, 7000, ['#4b4d52', '#606268', '#686a70'], 1.3);
    }),
    sidewalk: makePattern(64, (g, s) => {
      g.fillStyle = '#cfcabf'; g.fillRect(0, 0, s, s);
      speckle(g, s, 500, ['#c2bdb2', '#dbd6cc', '#b8b3a8'], 1.2);
      g.strokeStyle = 'rgba(0,0,0,.13)'; g.lineWidth = 1;
      g.strokeRect(.5, .5, 32, 32); g.strokeRect(32.5, 32.5, 32, 32);
      g.strokeRect(32.5, .5, 32, 32); g.strokeRect(.5, 32.5, 32, 32);
    }),
    paving: makePattern(64, (g, s) => {
      g.fillStyle = '#d9ccb2'; g.fillRect(0, 0, s, s);
      for (let row = 0; row < 4; row++)
        for (let col = -1; col < 3; col++) {
          const x = col * 32 + (row % 2) * 16, y = row * 16;
          const t = (R() - .5) * 24;
          g.fillStyle = `rgb(${217 + t},${204 + t},${178 + t})`;
          g.fillRect(x + 1, y + 1, 30, 14);
        }
      speckle(g, s, 200, ['rgba(0,0,0,.08)'], 1);
    }),
    dirt: makePattern(128, (g, s) => {
      g.fillStyle = '#cdb68a'; g.fillRect(0, 0, s, s);
      speckle(g, s, 1500, ['#bda57a', '#dcc79b', '#b09870', '#e2d0a8'], 1.6);
    }),
    sand: makePattern(128, (g, s) => {
      g.fillStyle = '#e6d39c'; g.fillRect(0, 0, s, s);
      speckle(g, s, 1500, ['#d9c48b', '#f0e0b0', '#cfb97e'], 1.4);
    }),
    deck: makePattern(64, (g, s) => {
      g.fillStyle = '#a77b4f'; g.fillRect(0, 0, s, s);
      g.strokeStyle = 'rgba(60,35,15,.4)'; g.lineWidth = 1;
      for (let y = 0; y < s; y += 8) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(s, y + .5); g.stroke(); }
      speckle(g, s, 200, ['rgba(60,35,15,.25)'], 1);
    }),
  };

  // ================== Препятствия (сетка для коллизий) ==================
  const CELL = 128, GN = Math.ceil(WORLD / CELL);
  const grid = Array.from({ length: GN * GN }, () => []);
  function addObs(o) {
    let x0, y0, x1, y1;
    if (o.t === 'r') { x0 = o.x; y0 = o.y; x1 = o.x + o.w; y1 = o.y + o.h; }
    else if (o.t === 'c') { x0 = o.x - o.r; y0 = o.y - o.r; x1 = o.x + o.r; y1 = o.y + o.r; }
    else { x0 = o.x - o.rx; y0 = o.y - o.ry; x1 = o.x + o.rx; y1 = o.y + o.ry; }
    for (let cy = Math.max(0, (y0 / CELL) | 0); cy <= Math.min(GN - 1, (y1 / CELL) | 0); cy++)
      for (let cx = Math.max(0, (x0 / CELL) | 0); cx <= Math.min(GN - 1, (x1 / CELL) | 0); cx++)
        grid[cy * GN + cx].push(o);
  }
  function solidAt(px, py) {
    if (px < 2 || py < 2 || px > WORLD - 2 || py > WORLD - 2) return true;
    for (const o of grid[((py / CELL) | 0) * GN + ((px / CELL) | 0)]) {
      if (o.t === 'r') { if (px > o.x && px < o.x + o.w && py > o.y && py < o.y + o.h) return true; }
      else if (o.t === 'c') { if ((px - o.x) ** 2 + (py - o.y) ** 2 < o.r * o.r) return true; }
      else if (((px - o.x) / o.rx) ** 2 + ((py - o.y) / o.ry) ** 2 < 1) return true;
    }
    return false;
  }

  // ================== Генерация города ==================
  const blocks = [];
  const homeDoors = [];  // двери дома и гаража (анимация)
  function drawHomeSign(hm, name, mine) {
    const key = (mine ? '*' : '') + name;
    if (!hm.sign || hm.sign.txt === key) return;
    hm.sign.txt = key;
    const g = hm.sign.c.getContext('2d'), w = 320, h = 64;
    g.fillStyle = mine ? '#ff7043' : name ? '#42a5f5' : '#78909c'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#fff'; g.lineWidth = 4; g.strokeRect(3, 3, w - 6, h - 6);
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    let label = name ? '🏠 ' + name : '🏠 ' + t('homeFree');
    let fs = 36; g.font = 'bold ' + fs + 'px sans-serif';
    while (g.measureText(label).width > w - 20 && fs > 16) { fs -= 2; g.font = 'bold ' + fs + 'px sans-serif'; }
    g.fillText(label, w / 2, h / 2 + 2);
    hm.sign.tex.needsUpdate = true;
  }
  let homeLightAt = null;
  function updateHomeLights() {
    let best = null, bd = Infinity;
    for (const hm of HOMES) { const d = Math.hypot(car.x - hm.inX, car.y - hm.inY); if (d < bd) { bd = d; best = hm; } }
    if (!best || best === homeLightAt || !best.lights) return;
    homeLightAt = best;
    best.lights.forEach(([x, y], k) => homeLights[k].position.set(x, 40, y));
  }
  const SHOPS = [];      // магазины: еда, одежда, покраска
  const HOMES = [];      // дома с гаражами: у каждого игрока свой
  const HOME_LOTS = ['0,0', '6,0', '0,6', '6,6', '3,6', '6,3'];
  let HOME = null;       // твой дом
  const tall = [];       // объекты с высотой (здания, деревья, фонари)
  const parked = [];     // припаркованные машины
  const decals = [];     // люки, пятна на дороге

  const glassCols = ['#5d7f9e', '#6b8fa8', '#4f6d85', '#7a95a6', '#45667f', '#86a3b5', '#5a7a8c'];
  const concreteCols = ['#c8c0b0', '#b5aea2', '#d6cdbb', '#a9a397', '#c2b59b', '#b9a58b'];
  const roofCols = ['#8a8d91', '#9b9a95', '#7c8085', '#a5a29a'];
  const houseWalls = ['#f1e6d0', '#e8dcc4', '#f5efe4', '#e2d3b5', '#dfe6e9', '#f0d9c0'];
  const houseRoofs = ['#b24a35', '#8d3b2c', '#6b4a3a', '#55606b', '#3f6b54', '#a8613b'];
  const carCols = ['#e53935', '#1e88e5', '#fdd835', '#43a047', '#fafafa', '#212121', '#8e24aa', '#fb8c00', '#90a4ae', '#00897b'];

  function addBuilding(x, y, w, h, H, style) {
    const c = style === 'glass' ? pick(glassCols) : pick(concreteCols);
    const roof = pick(roofCols);
    const b = {
      k: 'b', x, y, w, h, H, style, cx: x + w / 2, cy: y + h / 2,
      cols: { n: shade(c, 1.05), e: shade(c, .72), s: shade(c, .62), w: shade(c, .9) },
      base: c, roof, roofEdge: shade(roof, 1.15), roofIn: shade(roof, .9),
      details: [], heli: H > 280 && rnd() < .6, lit: Math.floor(rnd() * 1000),
    };
    const nd = Math.floor(rr(1, 4));
    for (let i = 0; i < nd; i++) {
      const dw = rr(14, 30), dh = rr(12, 24);
      b.details.push({ x: rr(x + 12, x + w - dw - 12), y: rr(y + 12, y + h - dh - 12), w: dw, h: dh });
    }
    tall.push(b);
    addObs({ t: "r", x, y, w, h, tall: true });
  }

  function addHouse(x, y, w, h) {
    const wall = pick(houseWalls), roof = pick(houseRoofs);
    const H1 = rr(26, 32);
    tall.push({
      k: 'h', x, y, w, h, H: H1, H2: H1 + rr(18, 24), cx: x + w / 2, cy: y + h / 2,
      cols: { n: shade(wall, 1.0), e: shade(wall, .75), s: shade(wall, .66), w: shade(wall, .92) },
      roofA: shade(roof, 1.1), roofB: shade(roof, .72), ridge: shade(roof, .55),
      chimney: rnd() < .6,
    });
    addObs({ t: "r", x, y, w, h, tall: true });
  }

  function addTree(x, y, r = rr(16, 24), solid = true) {
    if (solid && inCornerCut(x, y, SW + r * .6)) return;
    const pal = pick([
      ['#2f6b27', '#3f8a33', '#5aa845'],
      ['#2b5e2a', '#3a7d36', '#56a04c'],
      ['#37702a', '#4f9236', '#78b852'],
      ['#2d5f3a', '#3b7a4a', '#5c9e66'],
    ]);
    const blobs = [{ x: 0, y: 0, r: .72 }];
    const n = 5 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + rnd() * .5;
      blobs.push({ x: Math.cos(a) * .48, y: Math.sin(a) * .48, r: rr(.42, .58) });
    }
    tall.push({ k: 't', x, y, cx: x, cy: y, r, h: r * rr(2.2, 2.9), pal, blobs });
    // деревья больше не препятствие — сквозь них можно проезжать
  }

  function addLamp(x, y, dx, dy) {
    tall.push({ k: 'l', x, y, cx: x, cy: y, dx, dy });   // без препятствия — машина проезжает сквозь фонари
  }

  function addParked(x, y, angle) {
    if (inCornerCut(x, y, SW + 26)) return;
    const c = pick(carCols);
    parked.push({ x, y, angle, color: c });
    const vert = Math.abs(Math.sin(angle)) > .5;
    const w = vert ? 22 : 44, h = vert ? 44 : 22;
    addObs({ t: 'r', x: x - w / 2, y: y - h / 2, w, h });
  }

  // Парковка: ряды мест сверху вниз
  function parkingRows(lx, ly, w, rows, fill) {
    const lines = [];
    for (const row of rows) {
      const y0 = ly + row.y, depth = 54;
      for (let x = lx + 8; x + 30 <= lx + w - 8; x += 30) {
        lines.push([x, y0, x, y0 + depth]);
        if (rnd() < fill) addParked(x + 15, y0 + depth / 2, row.up ? -Math.PI / 2 : Math.PI / 2);
      }
      lines.push([lx + 8 + Math.floor((w - 16) / 30) * 30, y0, lx + 8 + Math.floor((w - 16) / 30) * 30, y0 + depth]);
    }
    return lines;
  }

  function genBlock(i, j) {
    const x = i * STEP * T + ROAD_W, y = j * STEP * T + ROAD_W;   // квартал начинается сразу за дорогой
    const lx = x + SW, ly = y + SW;
    const d = Math.max(Math.abs(i - 3), Math.abs(j - 3));
    const r = rnd();
    let type;
    if (d === 0) type = 'park';
    else if (d === 1) type = r < .8 ? 'downtown' : 'office';
    else if (d === 2) type = r < .4 ? 'office' : r < .6 ? 'parking' : r < .8 ? 'park' : 'downtown';
    else type = r < .55 ? 'residential' : r < .72 ? 'lake' : r < .88 ? 'park' : 'parking';
    if (HOME_LOTS.includes(i + ',' + j)) type = 'home';        // дома игроков
    if (i === 1 && j === 0) type = 'shops';                    // магазины рядом с домом
    if ((type === 'office' || type === 'parking') && (i + 2 * j) % 3 === 0) type = 'roofpark';   // дом с заездом на крышу
    const b = { x, y, lx, ly, type, ops: [] };
    const op = f => b.ops.push(f);

    if (type === 'downtown') {
      op(() => { ctx.fillStyle = PAT.paving; ctx.fillRect(lx, ly, LS, LS); });
      const lay = rnd();
      if (lay < .3) {
        addBuilding(lx + 30, ly + 30, LS - 60, LS - 60, rr(250, 340), 'glass');
      } else if (lay < .75) {
        const g = 30, s = (LS - 3 * g) / 2;
        for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++) {
          const bx = lx + g + c * (s + g), by = ly + g + a * (s + g);
          if (rnd() < .18) {
            op(() => { ctx.fillStyle = PAT.grass; roundRect(bx + 10, by + 10, s - 20, s - 20, 14); ctx.fill(); });
            addTree(bx + s * .3, by + s * .3); addTree(bx + s * .7, by + s * .35); addTree(bx + s * .5, by + s * .72);
          } else addBuilding(bx, by, s, s, rr(110, 300), rnd() < .7 ? 'glass' : 'grid');
        }
      } else {
        const g = 30, s = (LS - 3 * g) / 2;
        const vert = rnd() < .5;
        for (let c = 0; c < 2; c++) {
          if (vert) addBuilding(lx + g + c * (s + g), ly + g, s, LS - 2 * g, rr(150, 280), rnd() < .6 ? 'glass' : 'grid');
          else addBuilding(lx + g, ly + g + c * (s + g), LS - 2 * g, s, rr(150, 280), rnd() < .6 ? 'glass' : 'grid');
        }
      }
      for (const [tx, ty] of [[14, 14], [LS - 14, 14], [14, LS - 14], [LS - 14, LS - 14]]) addTree(lx + tx, ly + ty, 13);
    }

    else if (type === 'office') {
      op(() => { ctx.fillStyle = PAT.grass; ctx.fillRect(lx, ly, LS, LS); });
      const top = rnd() < .5;
      const bh = LS * .5;
      const by = top ? ly + 24 : ly + LS - bh - 24;
      addBuilding(lx + 30, by, LS - 60, bh - 10, rr(70, 150), 'grid');
      const py = top ? ly + bh + 30 : ly + 20;
      const ph = LS - bh - 50;
      const lines = parkingRows(lx + 20, py, LS - 40, [{ y: 8, up: false }, { y: ph - 62, up: true }], .65);
      op(() => {
        ctx.fillStyle = PAT.lot; roundRect(lx + 20, py, LS - 40, ph, 10); ctx.fill();
        drawLines(lines);
      });
      addTree(lx + 14, ly + 14, 14); addTree(lx + LS - 14, ly + LS - 14, 14);
    }

    else if (type === 'roofpark') {
      // пандус на маленький домик A, прыжок на домик B с мёртвой петлёй 360°, мостик с дыркой и трамплином, домик C и прыжок на улицу
      const depth = 130, cy = ly + LS / 2, y0 = cy - depth / 2;
      const houses = [[55, 45, 30], [135, 125, 28], [355, 45, 28]].map(([ox, w, H], i) => ({ x: lx + ox, y: y0, w, h: depth, H, i }));
      op(() => { ctx.fillStyle = PAT.paving; ctx.fillRect(lx, ly, LS, LS); });
      for (const hs of houses) addObs({ t: 'r', x: hs.x, y: hs.y, w: hs.w, h: hs.h, top: hs.H - 14 });
      const bridge = { x0: lx + 260, x1: lx + 355, gap0: lx + 300, gap1: lx + 318, H: 28, Wd: 92, cy: cy + 22 };   // мостик шире: на него выезжаешь из петли
      for (const sy of [-1, 1]) addObs({ t: 'r', x: bridge.x0, y: bridge.cy + sy * (bridge.Wd / 2) - (sy > 0 ? 3 : 0), w: bridge.x1 - bridge.x0, h: 3, bot: bridge.H, top: bridge.H + 12 });   // перила мостика
      b.roof = { houses, cy, rampX0: x, rampW: 90, bridge, loop: { cx: lx + 228, cy, base: 28, R: 28, off: 44, W: 40 } };
      addTree(lx + 30, ly + 30, 14); addTree(lx + 30, ly + LS - 30, 14); addTree(lx + 300, ly + 40, 13); addTree(lx + 300, ly + LS - 40, 13);
    }

    else if (type === 'parking') {
      const rows = [{ y: 12, up: false }, { y: 128, up: true }, { y: 182, up: false }, { y: 298, up: true }];
      const lines = parkingRows(lx + 10, ly, LS - 20, rows, .72);
      op(() => {
        ctx.fillStyle = PAT.lot; ctx.fillRect(lx, ly, LS, LS);
        drawLines(lines);
        // стрелки направления
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        for (const yy of [ly + 98, ly + 268]) for (const xx of [lx + 110, lx + 290]) arrow(xx, yy, xx < lx + 200 ? 0 : Math.PI);
      });
      addTree(lx + 200, ly + 236 - 28, 12);
    }

    else if (type === 'home') {
      // огромный дом (можно зайти внутрь) и гараж для твоей машины; двери смотрят на западную улицу
      const t = 8;
      const house = { x0: x + 40, y0: y + 30, w: 260, h: 220, H: 96, d0: y + 115, d1: y + 165, doorH: 48 };
      const gar = { x0: x + 40, y0: y + 272, w: 170, h: 135, H: 52, d0: y + 300, d1: y + 380, doorH: 40 };
      const walls = [];
      const room = (r, divX) => {
        const { x0, y0, w, h, d0, d1 } = r;
        walls.push([x0, y0, w, t, r.H], [x0, y0 + h - t, w, t, r.H], [x0 + w - t, y0, t, h, r.H],
                   [x0, y0, t, d0 - y0, r.H], [x0, d1, t, y0 + h - d1, r.H]);                         // западная стена с дверью
        if (divX) walls.push([divX, y0, 6, d0 - y0, r.H], [divX, d1, 6, y0 + h - d1, r.H]);          // перегородка между комнатами
      };

      for (const [wx, wy, ww, wh] of walls) addObs({ t: 'r', x: wx, y: wy, w: ww, h: wh, tall: true });

    for (const z of [-5.5, 5.5]) add(new THREE.BoxGeometry(12, 2.6, 2.6), suit, 3 + lean * 3, r + 19 - lean * 2, z, body, -.45 + lean * .3); // руки
    add(new THREE.SphereGeometry(4.8, 16, 12), helmet, 1 + lean * 11, r + 30 - lean * 6, 0);
    add(new THREE.BoxGeometry(1.2, 2.6, 6.5), visor, 5.4 + lean * 11, r + 30 - lean * 6, 0);
    // колёса
    const tireGeo = new THREE.CylinderGeometry(r, r, 3.4, 20); tireGeo.rotateX(Math.PI / 2);
    const hubGeo = new THREE.CylinderGeometry(r * .5, r * .5, 3.6, 12); hubGeo.rotateX(Math.PI / 2);
    const wheels = [], pivots = [];
    for (const x of [wx, -wx]) {
      const pivot = new THREE.Group(); pivot.position.set(x, r, 0); inner.add(pivot);
      const w = new THREE.Group(); pivot.add(w);
      add(tireGeo, dark, 0, 0, 0, w); add(hubGeo, chrome, 0, 0, 0, w);
      add(new THREE.BoxGeometry(1.2, r * 1.5, 3.8), chrome, 0, 0, 0, w);
      wheels.push(w); pivots.push(pivot);
    }
    // гонщик — отдельной группой, чтобы он мог слезть с мотоцикла
    const driver = new THREE.Group(); body.add(driver);
    for (const ch of [...body.children]) if ([suit, helmet, visor].includes(ch.material)) driver.add(ch);
    return { root, tg, body, wheels, pivots, tailMat, r, driver, paint };
  }

  function buildCar(spec) {
    const root = new THREE.Group();
    const tg = new THREE.Group(); tg.position.y = 10; root.add(tg);     // поворачивается при трюках
    const inner = new THREE.Group(); inner.position.y = -10; tg.add(inner);
    const body = new THREE.Group(); inner.add(body);
    const paint = new THREE.MeshPhysicalMaterial({ color: spec.color, metalness: .45, roughness: .32, clearcoat: 1, clearcoatRoughness: .06, envMap: scene.userData.env, envMapIntensity: 1 });   // лакированный кузов
    const dark = new THREE.MeshStandardMaterial({ color: '#151515', roughness: .8 });
    const glass = new THREE.MeshStandardMaterial({ color: '#0f1922', metalness: .5, roughness: .1, envMap: scene.userData.env, envMapIntensity: .6, transparent: true, opacity: .5, depthWrite: false });   // сквозь стёкла видно водителя
    const white = new THREE.MeshStandardMaterial({ color: '#f5f5f5', roughness: .4 });
    const add = (geo, m, x, y, z, parent = body) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o; };
    const W = spec.width;
    add(extrudeProfile(spec.body, W), paint, 0, 0, 0);
    add(extrudeProfile(spec.cabin, W - 3.5, .8), glass, 0, 0, 0);
    // крыша поверх стекла
    const c = spec.cabin, roofY = Math.max(c[2][1], c[3][1]);
    // водитель за рулём (слева)
    const driver = new THREE.Group(); body.add(driver);
    {
      const baseY = Math.max(c[0][1], c[1][1]) - 1, hgt = roofY - baseY, sc = Math.min(1, hgt / 10.5);
      const dx = (c[0][0] + c[1][0]) / 2 - 1, dz = -W / 4 + .5;
      const shirt = new THREE.MeshStandardMaterial({ color: '#c62828', roughness: .8 });
      const skin = new THREE.MeshStandardMaterial({ color: '#f1c27d', roughness: .7 });
      const hair = new THREE.MeshStandardMaterial({ color: '#3b2314', roughness: .9 });
      add(new THREE.BoxGeometry(4.2 * sc, 6 * sc, 5.6 * sc), shirt, dx - .5, baseY + 3 * sc, dz, driver);
      add(new THREE.SphereGeometry(2.5 * sc, 10, 8), skin, dx, baseY + 7.6 * sc, dz, driver);
      add(new THREE.SphereGeometry(2.6 * sc, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), hair, dx - .3, baseY + 7.9 * sc, dz, driver);
      add(new THREE.TorusGeometry(2.2 * sc, .4, 6, 14).rotateY(Math.PI / 2), dark, dx + 4 * sc, baseY + 5 * sc, dz, driver);   // руль
    }
    add(new THREE.BoxGeometry(Math.abs(c[2][0] - c[3][0]) + 1, 1, W - 4.5), paint, (c[2][0] + c[3][0]) / 2, roofY + 1.4, 0);
    // бамперы / диффузор
    add(new THREE.BoxGeometry(2, 3, W - 1), dark, 23.3, 4.5, 0);
    add(new THREE.BoxGeometry(2, 3, W - 1), dark, -23.3, 4.5, 0);
    if (spec.stripes) {
      const sm = new THREE.MeshStandardMaterial({ color: spec.stripes, roughness: .4 });
      for (const z of [-2.6, 2.6]) {
        add(new THREE.BoxGeometry(14, .3, 2.2), sm, 15, 14.9, z);
        add(new THREE.BoxGeometry(12, .3, 2.2), sm, -17, 14.9, z);
      }
    }
    if (spec.accent) { // двухцветный кузов: тёмная передняя часть
      const am = new THREE.MeshStandardMaterial({ color: spec.accent, metalness: .4, roughness: .3 });
      for (const z of [-1, 1]) add(new THREE.BoxGeometry(14, 5, .6), am, -4, 7.5, z * (W / 2 + .5));
    }
    if (spec.scoop) add(new THREE.BoxGeometry(8, 2.5, 7), dark, 12, 14.8, 0);
    if (spec.spoiler) add(new THREE.BoxGeometry(3, 1, W - 2), dark, -21.5, 11.5, 0);
    let lights = null;
    if (spec.police) {
      const blk = new THREE.MeshStandardMaterial({ color: '#111111', roughness: .5 });
      for (const z of [-1, 1]) add(new THREE.BoxGeometry(20, 4.5, .6), blk, -2, 8.5, z * (W / 2 + .4));
      const rx = (c[2][0] + c[3][0]) / 2;
      add(new THREE.BoxGeometry(5, 1.4, 16), dark, rx, roofY + 1.9, 0);
      const red = new THREE.MeshStandardMaterial({ color: '#ff1744', emissive: '#ff1744', emissiveIntensity: 2 });
      const blue = new THREE.MeshStandardMaterial({ color: '#2979ff', emissive: '#2979ff', emissiveIntensity: 2 });
      add(new THREE.BoxGeometry(4.2, 2.6, 6.5), red, rx, roofY + 3.6, -4);
      add(new THREE.BoxGeometry(4.2, 2.6, 6.5), blue, rx, roofY + 3.6, 4);
      lights = [red, blue];
    }
    if (spec.wing) {
      add(new THREE.BoxGeometry(5, .8, W + 1), dark, -20.5, 15.5, 0);
      for (const z of [-6, 6]) add(new THREE.BoxGeometry(1.5, 5, 1), dark, -20.5, 12.5, z);
    }
    const headMat = new THREE.MeshStandardMaterial({ color: '#fffbe8', emissive: '#fff3c0', emissiveIntensity: 2.2 });
    const tailMat = new THREE.MeshStandardMaterial({ color: '#8a0d0d', emissive: '#ff1a1a', emissiveIntensity: .3 });
    for (const z of [-1, 1]) {
      add(new THREE.BoxGeometry(1.5, 2.2, 5), headMat, 23.4, spec.head, z * (W / 2 - 4));
      add(new THREE.BoxGeometry(1.5, 2.4, 6), tailMat, -23.6, spec.tail, z * (W / 2 - 4.5));
    }
    add(new THREE.BoxGeometry(.6, 3, 9), white, -24.6, 6, 0);           // номер
    for (const z of [-1, 1]) add(new THREE.BoxGeometry(3, 2, 2.5), paint, (c[0][0] + c[1][0]) / 2 + 6, c[1][1] + 1.5, z * (W / 2 + 1)); // зеркала

    const r = spec.wheelR;
    const tireGeo = new THREE.CylinderGeometry(r, r, 3.8, 18); tireGeo.rotateX(Math.PI / 2);
    const hubGeo = new THREE.CylinderGeometry(r * .55, r * .55, 4, 10); hubGeo.rotateX(Math.PI / 2);
    const hubMat = new THREE.MeshStandardMaterial({ color: '#c9ccd0', metalness: .5, roughness: .3, envMap: scene.userData.env });
    const wheels = [], pivots = [];
    for (const [x, z] of [[spec.wheelX, -W / 2], [spec.wheelX, W / 2], [-spec.wheelX, -W / 2], [-spec.wheelX, W / 2]]) {
      const pivot = new THREE.Group(); pivot.position.set(x, r, z); inner.add(pivot);
      const w = new THREE.Group(); pivot.add(w);
      add(tireGeo, dark, 0, 0, 0, w); add(hubGeo, hubMat, 0, 0, 0, w);
      add(new THREE.BoxGeometry(1.2, r * 1.25, 4.2), hubMat, 0, 0, 0, w);
      wheels.push(w); pivots.push(pivot);
    }
    return { root, tg, body, wheels, pivots, tailMat, r, lights, driver, paint };
  }

  // ---------- Сохранение: деньги, купленные машины ----------
  const SAVE_KEY = 'mashinki_save_v1';
  let save = { money: 0, owned: ['zhuk'], current: 'zhuk', friends: { names: ['Армин', 'Кинан'], on: true } };
  try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
  let spec = CARS.find(c => c.id === save.current) || CARS[0];
  let player = null;
  function setCar(id) {
    spec = CARS.find(c => c.id === id) || CARS[0];
    save.current = spec.id; persist();
    if (player) scene.remove(player.root);
    player = buildVehicle(spec);
    if (car.onFoot && player.driver) player.driver.visible = false;
    scene.add(player.root);
    applyPaint();
  }
  setCar(save.current);

  // ---------- Картинки машин для магазина ----------
  const thumbs = {};
  {
    const tr = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    tr.setSize(300, 170); tr.setPixelRatio(1);
    tr.outputColorSpace = THREE.SRGBColorSpace; tr.toneMapping = THREE.ACESFilmicToneMapping;
    const ts = new THREE.Scene();
    ts.add(new THREE.HemisphereLight('#ffffff', '#666666', 1.6));
    const dl = new THREE.DirectionalLight('#ffffff', 2.2); dl.position.set(40, 60, 50); ts.add(dl);
    const tc = new THREE.PerspectiveCamera(30, 300 / 170, 1, 500);
    tc.position.set(62, 38, 78); tc.lookAt(0, 7, 0);
    for (const c of CARS) {
      const m = buildVehicle(c);
      m.root.rotation.y = -0.15;
      if (c.kind === 'moto') { tc.position.set(58, 40, 72); tc.lookAt(0, 17, 0); } else { tc.position.set(62, 38, 78); tc.lookAt(0, 7, 0); }
      ts.add(m.root);
      tr.render(ts, tc);
      thumbs[c.id] = tr.domElement.toDataURL();
      ts.remove(m.root);
    }
    tr.dispose();
  }

  // ---------- Окно гаража ----------
  const garageEl = document.getElementById('garage');
  const gridEl = document.getElementById('cars');
  let garageOpen = false;
  const fmt = n => n.toLocaleString(t('locale')) + ' €';
  const carName = c => (I18N[LANG].cars || {})[c.id]?.[0] ?? c.name;
  const carDesc = c => (I18N[LANG].cars || {})[c.id]?.[1] ?? c.desc;
  const TOP = { max: Math.max(...CARS.map(c => c.max)), accel: Math.max(...CARS.map(c => c.accel)), hand: Math.max(...CARS.map(c => c.turn * c.grip)) };
  function bar(label, v) { return `<div class="stat"><span>${label}</span><i><b style="width:${Math.round(v * 100)}%"></b></i></div>`; }
  function renderGarage() {
    document.getElementById('gMoney').textContent = fmt(save.money);
    gridEl.innerHTML = CARS.map(c => {
      const owned = save.owned.includes(c.id), cur = save.current === c.id;
      let btn;
      if (cur) btn = `<button class="sel" disabled>${t('selected')}</button>`;
      else if (owned) btn = `<button data-pick="${c.id}">${t('choose')}</button>`;
      else if (save.money >= c.price) btn = `<button class="buy" data-buy="${c.id}">${t('buyFor', { p: fmt(c.price) })}</button>`;
      else btn = `<button class="no" disabled>${t('needMore', { p: fmt(c.price - save.money) })}</button>`;
      return `<div class="card ${cur ? 'cur' : ''}">
        <img src="${thumbs[c.id]}" alt="">
        <h3>${c.kind === 'moto' ? '🏍' : '🚗'} ${carName(c)}</h3>
        <div class="price">${c.price ? fmt(c.price) : t('free')}</div>
        <p>${carDesc(c)}</p>
        ${bar(t('speed'), c.max / TOP.max)}${bar(t('accel'), c.accel / TOP.accel)}${bar(t('handling'), c.turn * c.grip / TOP.hand)}
        <div class="kmh">${t('upTo', { v: Math.round(c.max * .33) })}</div>
        ${btn}</div>`;
    }).join('');
  }
  gridEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.buy) {
      const c = CARS.find(x => x.id === b.dataset.buy);
      if (save.money < c.price) return;
      save.money -= c.price; save.owned.push(c.id); persist();
      setCar(c.id);
      showMsg(t('newCar', { n: carName(c) }), 2500);
    } else if (b.dataset.pick) setCar(b.dataset.pick);
    renderGarage();
  });
  function toggleGarage(force) {
    garageOpen = force ?? !garageOpen;
    garageEl.style.display = garageOpen ? 'flex' : 'none';
    if (garageOpen) { renderGarage(); car.vx = car.vy = 0; }
    else if (!menuOpen) canvas.focus();
  }
  document.getElementById('garageBtn').addEventListener('click', () => toggleGarage());
  document.getElementById('gClose').addEventListener('click', () => toggleGarage(false));
  window.__toggleGarage = toggleGarage;
  langHooks.push(() => { if (garageOpen) renderGarage(); });

  // Стрелка к ближайшей монете
  const arrowMesh = new THREE.Mesh(new THREE.ConeGeometry(3.2, 10, 10).rotateZ(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: '#ffd54f', emissive: '#ffb300', emissiveIntensity: .7 }));
  scene.add(arrowMesh);

  // ================== Трамплины ==================
  // Зоны, где стоят мост и тоннели — там не ставим случайные трамплины и монеты
  const RESERVED = [
    { x0: 640, y0: roadPos(5), x1: roadPos(5) + 40, y1: roadPos(5) + ROAD_W },        // трюк-мост и дом-тоннель
    { x0: roadPos(6), y0: roadPos(1) + ROAD_W, x1: roadPos(6) + ROAD_W, y1: roadPos(2) }, // второй тоннель
  ];
  const inReserved = (x, y, m = 0) => RESERVED.some(z => x > z.x0 - m && x < z.x1 + m && y > z.y0 - m && y < z.y1 + m);

  const RAMPS = [];
  {
    let tries = 0;
    while (RAMPS.length < 16 && tries++ < 800) {
      const big = RAMPS.length < 4;
      const k = Math.floor(rnd() * (NB + 1)), sg = Math.floor(rnd() * NB), vert = rnd() < .5;
      const a0 = roadPos(sg) + ROAD_W, a1 = roadPos(sg + 1);
      const mid = (a0 + a1) / 2 + rr(-50, 50);
      const L = big ? 220 : 160, H = big ? 34 : 24, Wd = big ? 112 : 54;
      const lane = big ? (rnd() < .5 ? ROAD_W / 4 : ROAD_W * 3 / 4) : T / 2 + T * Math.floor(rnd() * (ROAD_W / T));
      const sign = rnd() < .5 ? 1 : -1;
      const cx = vert ? roadPos(k) + lane : mid, cy = vert ? mid : roadPos(k) + lane;
      const d = vert ? sign * Math.PI / 2 : (sign > 0 ? 0 : Math.PI);
      if (Math.hypot(cx - T * 1.5, cy - 3 * T) < 600) continue;
      if (inReserved(cx, cy, 160)) continue;
      if (RAMPS.some(r => Math.hypot(r.cx - cx, r.cy - cy) < 550)) continue;
      RAMPS.push({ cx, cy, d, L, H, Wd, big, ux: Math.cos(d), uy: Math.sin(d), base: 0 });
    }
  }

  // ================== Трюк-трасса: мост с дыркой → крыша дома → прыжок ==================
  const PLATS = [];
  // Платформы — поверхности, по которым можно ездить: h0→h1 — высота в начале и в конце, bot — низ (под мостом можно проехать)
  const CY = roadPos(5) + ROAD_W / 2;              // центр дороги, вдоль которой идёт трасса (по оси X)
  const BX = [roadPos(1) + ROAD_W, roadPos(2), roadPos(3), roadPos(3) + ROAD_W, roadPos(4), roadPos(4) + ROAD_W]; // 704, 1152, 1728, 1856, 2304, 2432
  const DECK = 64, ROOF = 50;
  const hplat = (x0, x1, h0, h1, bot, cy = CY, w = ROAD_W) => PLATS.push({ cx: (x0 + x1) / 2, cy, ux: 1, uy: 0, L: x1 - x0, Wd: w, h0, h1, bot });
  hplat(BX[0], BX[1], 0, DECK, 0);                               // въезд на мост
  const HOLE = [BX[1] + 288, BX[1] + 368];                        // дырка в мосту (на южной полосе)
  hplat(BX[1], HOLE[0], DECK, DECK, DECK - 8);
  hplat(HOLE[0], HOLE[1], DECK, DECK, DECK - 8, CY - ROAD_W / 4, ROAD_W / 2);  // над дыркой — только северная полоса
  hplat(HOLE[1], BX[2], DECK, DECK, DECK - 8);
  hplat(BX[3], BX[4], ROOF, ROOF, ROOF - 8);                     // крыша дома-тоннеля
  PLATS.push({ cx: roadPos(6) + ROAD_W / 2, cy: (roadPos(1) + ROAD_W + roadPos(2)) / 2, ux: 0, uy: 1, L: roadPos(2) - roadPos(1) - ROAD_W, Wd: ROAD_W, h0: ROOF, h1: ROOF, bot: ROOF - 8 }); // крыша второго тоннеля
  // трамплины-«кикеры» в конце моста и на краю крыши
  RAMPS.push({ kick: true, base: DECK, cx: BX[2] - 40, cy: CY, d: 0, ux: 1, uy: 0, L: 80, H: 16, Wd: ROAD_W - 20, vzCap: 150, minVz: 130, boost: 590 });
  const LOOPS = [];
  for (const HOME of HOMES) for (const [r, tag] of [[HOME.house, 'house'], [HOME.gar, 'gar']])            // крыши дома и гаража: камера не залезает выше потолка
    PLATS.push({ cx: r.x0 + r.w / 2, cy: r.y0 + r.h / 2, ux: 1, uy: 0, L: r.w, Wd: r.h, h0: r.H, h1: r.H, bot: r.H - 6, home: tag });
  for (const b of blocks) if (b.roof) {
    const Rf = b.roof, hs = Rf.houses, Bg = Rf.bridge;
    PLATS.push({ cx: (Rf.rampX0 + hs[0].x) / 2, cy: Rf.cy, ux: 1, uy: 0, L: hs[0].x - Rf.rampX0, Wd: Rf.rampW, h0: 0, h1: hs[0].H, bot: 0, roof: true });   // пандус
    for (const h of hs) PLATS.push({ cx: h.x + h.w / 2, cy: Rf.cy, ux: 1, uy: 0, L: h.w, Wd: h.h, h0: h.H, h1: h.H, bot: 0, roof: true });   // крыши
    for (const [a, c] of [[Bg.x0, Bg.gap0], [Bg.gap1, Bg.x1]])                                                                           // мостик (с дыркой посередине)
      PLATS.push({ cx: (a + c) / 2, cy: Bg.cy, ux: 1, uy: 0, L: c - a, Wd: Bg.Wd, h0: Bg.H, h1: Bg.H, bot: Bg.H - 6, roof: true });
    const A = hs[0], C = hs[2];
    RAMPS.push({ kick: true, base: A.H, cx: A.x + A.w - 16, cy: Rf.cy, d: 0, ux: 1, uy: 0, L: 32, H: 7, Wd: 90, vzCap: 38, minVz: 28, hop: true });        // с домика A на домик B
    RAMPS.push({ kick: true, base: Bg.H, cx: Bg.gap0 - 14, cy: Bg.cy, d: 0, ux: 1, uy: 0, L: 28, H: 6, Wd: Bg.Wd, vzCap: 45, minVz: 32, hop: true });     // через дырку в мостике
    RAMPS.push({ kick: true, base: C.H, cx: C.x + C.w - 20, cy: Bg.cy, d: 0, ux: 1, uy: 0, L: 40, H: 12, Wd: 110, vzCap: 160, minVz: 110 });              // с домика C на улицу
    LOOPS.push(Rf.loop);
  }
  RAMPS.push({ kick: true, base: ROOF, cx: BX[4] - 45, cy: CY, d: 0, ux: 1, uy: 0, L: 90, H: 18, Wd: ROAD_W - 20, vzCap: 150, minVz: 130, boost: 540 });
  // перила на мосту и стены тоннелей (bot/top — по какой высоте они твёрдые)
  addObs({ t: 'r', x: BX[1], y: roadPos(5), w: BX[2] - BX[1], h: 5, bot: DECK, top: DECK + 14 });
  addObs({ t: 'r', x: BX[1], y: roadPos(5) + ROAD_W - 5, w: BX[2] - BX[1], h: 5, bot: DECK, top: DECK + 14 });
  addObs({ t: 'r', x: BX[3], y: roadPos(5), w: BX[4] - BX[3], h: 10, top: ROOF - 8 });
  addObs({ t: 'r', x: BX[3], y: roadPos(5) + ROAD_W - 10, w: BX[4] - BX[3], h: 10, top: ROOF - 8 });
  addObs({ t: 'r', x: roadPos(6), y: roadPos(1) + ROAD_W, w: 10, h: roadPos(2) - roadPos(1) - ROAD_W, top: ROOF - 8 });
  addObs({ t: 'r', x: roadPos(6) + ROAD_W - 10, y: roadPos(1) + ROAD_W, w: 10, h: roadPos(2) - roadPos(1) - ROAD_W, top: ROOF - 8 });
  const PILLARS = [];
  for (const x of [BX[1] + 160, BX[1] + 300, BX[1] + 440])
    for (const y of [roadPos(5) - 11, roadPos(5) + ROAD_W + 11]) { PILLARS.push([x, y]); addObs({ t: 'c', x, y, r: 7, top: DECK - 8 }); }

  function rampLocal(r, x, y) { const dx = x - r.cx, dy = y - r.cy; return [dx * r.ux + dy * r.uy + r.L / 2, -dx * r.uy + dy * r.ux]; }
  const inside = (r, u, v) => u >= 0 && u <= r.L && Math.abs(v) <= r.Wd / 2;
  function rampH(r, u) {
    if (r.kick) return r.base + r.H * Math.max(0, Math.min(1, u / r.L));
    return r.base + r.H * Math.max(0, 1 - Math.abs(u - r.L / 2) / (r.L / 2));
  }
  const platH = (p, u) => p.h0 + (p.h1 - p.h0) * Math.max(0, Math.min(1, u / p.L));
  function rampHeight(r, x, y) { const [u] = rampLocal(r, x, y); return rampH(r, u); }
  // трамплин под машиной (только тот, до которого она достаёт по высоте)
  function rampAt(x, y, z = car.z) {
    for (const r of RAMPS) {

    // дом с тоннелем: стены с окнами, крыша-дорога, светильники внутри
    function tunnelHouse(x0, y0, x1, y1, alongX, roofIsRoad) {

        add(geo, alongX ? [plain, plain, plain, plain, side ? fac : inner, side ? inner : fac] : [side ? fac : inner, side ? inner : fac, plain, plain, plain, plain], cx, ROOF / 2, cz);
      }

  }

  // ================== Монеты ==================
  let coins = [];

  // Виды монет: бронзовая 100 €, серебряная 250 €, золотая 500 €
  const COIN_TYPES = [
    { value: 100, chance: .6, scale: 1, color: '#d9894a', emissive: '#6b3410', fx: '#ffb27a' },
    { value: 250, chance: .3, scale: 1.15, color: '#dfe4ea', emissive: '#4a5560', fx: '#ffffff' },

  function rollCoinType() { let r = Math.random(); for (const t of COIN_TYPES) { if ((r -= t.chance) < 0) return t; } return COIN_TYPES[0]; }
  function spawnCoins() {
    for (const c of coins) scene.remove(c.mesh);

      if (c.x < 20 || c.y < 20 || c.x > WORLD - 20 || c.y > WORLD - 20) continue;

    const course = [

      [BX[2] + ROAD_W / 2, CY, 100, 2], [BX[3] + 140, CY, ROOF + 14, 1], [BX[3] + 300, CY, ROOF + 14, 1],

    ];

      course.push([hs[0].x + hs[0].w + 18, b.roof.cy, hs[0].H + 22, 1], [Lp.cx, Lp.cy + Lp.off / 2, Lp.base + 2 * Lp.R - 6, 2], [(Bg.gap0 + Bg.gap1) / 2, Bg.cy, Bg.H + 20, 1]); }
    for (const [x, y, z, ti] of course) {

      c.mesh = new THREE.Mesh(coinGeo, c.type.mat);

  }

  // ================== Частицы (дым, пыль, искры) ==================
  const puffTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');

  })();
  const parts = [];
  for (let i = 0; i < 160; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, transparent: true, depthWrite: false }));
    s.visible = false; scene.add(s);

  }
  let partIdx = 0;
  function emit(x, y, z, color, size, life, vx = 0, vy = 0, vz = 0, grow = 18, alpha = .5) {
    const p = parts[partIdx = (partIdx + 1) % parts.length];
    Object.assign(p, { x, y, z, vx, vy, vz, size, life, max: life, grow, alpha });

  // ================== Игра ==================
  function resetCar() {
    Object.assign(car, { x: T * 1.5, y: 3 * T, angle: Math.PI / 2, vx: 0, vy: 0, steer: 0, z: 0, vz: 0, air: false, ramp: null, stun: 0, loop: null });

  }
  function newGame() {
    if (typeof chase !== 'undefined' && chase.active) endChase();
    if (car.onFoot) { car.onFoot = false; foot.root.visible = false; footBlob.visible = false; if (player.driver) player.driver.visible = true; setOnFootClass(); }
    resetCar(); spawnCoins(); collected = 0; finished = false;
    if (typeof resetFriends === 'function') resetFriends(true);
    startTime = performance.now();
    document.getElementById('total').textContent = coins.length;
  }

  function solidTallAt(px, py) {
    if (px < 0 || py < 0 || px >= WORLD || py >= WORLD) return false;
    for (const o of grid[((py / CELL) | 0) * GN + ((px / CELL) | 0)])
      if (o.tall && px > o.x && px < o.x + o.w && py > o.y && py < o.y + o.h) return true;
    return false;
  }

  function collectCoins() {
    for (const c of coins) {
      if (!c.taken && Math.hypot(c.x - car.x, c.y - car.y) < 36 && Math.abs(car.z + 10 - c.z) < 34) {
        c.taken = true; collected++; c.mesh.visible = false;
        save.money += c.type.value; persist();
        popMoney('+' + c.type.value + ' €', c.type.fx);
        for (let i = 0; i < 16; i++) {
          const a = Math.random() * 6.28, v = 40 + Math.random() * 100;
          emit(c.x, c.z, c.y, c.type.fx, 2.5, .6, Math.cos(a) * v, 40 + Math.random() * 60, Math.sin(a) * v, 0, 1);
        }
        if (collected === coins.length) {
          save.money += 1000; persist();
          showMsg(t('allCoins'), 4000);
          spawnCoins(); collected = 0;
        }
      }
    }

  }

  const G = 330, SPIN = 12, TAU = Math.PI * 2;
  const trick = { pitch: 0, pitchT: 0, roll: 0, rollT: 0 };
  let prevAirKeys = {}, slopePitch = 0;
  const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
  function launch(vz) {
    car.air = true; car.vz = vz; car.airT = 0;
    Object.assign(trick, { pitch: 0, pitchT: 0, roll: 0, rollT: 0 });
    prevAirKeys = { ...keys };   // зажатый газ не должен сразу запускать сальто
  }
  function moveWithCollisions(dt) {
    const nx = car.x + car.vx * dt, ny = car.y + car.vy * dt;
    if (!collides(nx, ny, car.angle)) { car.x = nx; car.y = ny; }
    else {
      if (Math.hypot(car.vx, car.vy) > 140) shake = 5;
      if (!collides(nx, car.y, car.angle)) { car.x = nx; car.vy *= -.25; }
      else if (!collides(car.x, ny, car.angle)) { car.y = ny; car.vx *= -.25; }
      else { car.vx *= -.25; car.vy *= -.25; }
    }
  }
  // мёртвая петля: машина едет по кругу, скорость падает на подъёме; если медленно — срывается или скатывается назад
  const LOOP_G = 180;
  function startLoop(Lp, v) {
    car.loop = { L: Lp, th: 0, v, y0: car.y };
    car.angle = 0; car.vy = 0; car.ramp = null; drift.t = drift.score = 0;
  }
  function loopUpdate(dt) {
    const lo = car.loop, Lp = lo.L;
    lo.v -= LOOP_G * Math.sin(lo.th) * dt;
    if (keys.up) lo.v += 50 * dt;
    lo.th += lo.v / Lp.R * dt;
    const c = Math.cos(lo.th), sn = Math.sin(lo.th);
    if (c < -.05 && lo.v * lo.v < LOOP_G * Lp.R * -c) {        // не хватило скорости — срыв с петли
      const th = lo.th; car.loop = null;
      car.vx = lo.v * Math.cos(th); car.vy = 0;
      launch(lo.v * Math.sin(th));
      trick.pitch = wrapA(th); trick.pitchT = 0; prevAirKeys = { up: true, down: true, left: true, right: true };
      return;
    }
    if (lo.th <= 0) {                                         // скатился назад
      car.loop = null; car.x = Lp.cx - 2; car.z = Lp.base; car.vx = lo.v; car.vy = 0;
      Object.assign(trick, { pitch: 0, pitchT: 0, roll: 0, rollT: 0 });
      return;
    }
    const k = Math.min(1, lo.th / TAU), lane = Lp.cy + Lp.off * k;
    car.x = Lp.cx + Lp.R * Math.sin(Math.min(lo.th, TAU));
    car.z = Lp.base + Lp.R * (1 - Math.cos(Math.min(lo.th, TAU)));
    car.y = lo.y0 + (lane - lo.y0) * Math.min(1, lo.th / .8);
    trick.pitch = trick.pitchT = Math.min(lo.th, TAU); trick.roll = trick.rollT = 0;
    curFwd = lo.v;
    if (lo.th >= TAU) {                                       // петля пройдена!
      car.loop = null; car.x = Lp.cx + 1; car.z = Lp.base; car.vx = lo.v; car.vy = 0; car.angle = 0;
      Object.assign(trick, { pitch: 0, pitchT: 0, roll: 0, rollT: 0 });
      save.money += 400; persist();
      popMoney('360°! +400 €', '#7CFFB2'); shake = 3;
      setTimeout(() => addWanted(1), 900);
    }
    collectCoins(); shake *= .85;
  }
  function airUpdate(dt) {
    if (car.stun > 0) {           // после неудачной посадки — машину крутит обратно на колёса
      car.stun -= dt;
      car.vx *= Math.pow(.03, dt); car.vy *= Math.pow(.03, dt);
      moveWithCollisions(dt);
      trick.pitch += (0 - trick.pitch) * Math.min(1, 5 * dt);
      trick.roll += (0 - trick.roll) * Math.min(1, 5 * dt);
      car.z = groundHeight(car.x, car.y);
      curFwd = 0;
      collectCoins(); shake *= .85;
      return;
    }
    car.airT += dt;
    moveWithCollisions(dt);
    car.vz -= G * dt;
    car.z += car.vz * dt;
    // трюки: 1/W — сальто вперёд, 2/S — сальто назад, 9/0 или A/D — бочка
    const pressed = a => keys[a] && !prevAirKeys[a];
    const done = (cur, tgt) => Math.abs(cur - tgt) < .05;
    if (pressed('up') || (keys.up && trick.pitchT < 0 && done(trick.pitch, trick.pitchT))) trick.pitchT -= TAU;
    if (pressed('down') || (keys.down && trick.pitchT > 0 && done(trick.pitch, trick.pitchT))) trick.pitchT += TAU;
    if (pressed('left') || (keys.left && trick.rollT < 0 && done(trick.roll, trick.rollT))) trick.rollT -= TAU;
    if (pressed('right') || (keys.right && trick.rollT > 0 && done(trick.roll, trick.rollT))) trick.rollT += TAU;
    prevAirKeys = { ...keys };
    const step = (cur, tgt) => cur + Math.max(-SPIN * dt, Math.min(SPIN * dt, tgt - cur));
    trick.pitch = step(trick.pitch, trick.pitchT);
    trick.roll = step(trick.roll, trick.rollT);
    const gh = groundHeight(car.x, car.y);
    if (car.z <= gh) land(gh);
    collectCoins(); shake *= .85;
  }
  function land(gh) {
    car.air = false; car.z = gh; car.vz = 0;
    const ok = Math.abs(trick.pitch - trick.pitchT) < .55 && Math.abs(trick.roll - trick.rollT) < .55;
    const flips = Math.round(Math.abs(trick.pitchT) / TAU), rolls = Math.round(Math.abs(trick.rollT) / TAU);
    if (ok) {
      let reward = 0; const names = [];
      if (flips) { reward += flips * 300; names.push((flips > 1 ? flips + '× ' : '') + (trick.pitchT < 0 ? t('flip') : t('backflip'))); }
      if (rolls) { reward += rolls * 200; names.push((rolls > 1 ? rolls + '× ' : '') + t('roll')); }
      if (!flips && !rolls && car.airT > .45) { reward = 50; names.push(t('jump')); }
      if (reward) {
        save.money += reward; persist();
        popMoney(names.join(' + ') + '! +' + reward + ' €', flips || rolls ? '#7CFFB2' : '#ffffff');
      }
      if (flips || rolls) setTimeout(() => addWanted(1), 900);   // после каждого трюка — звезда розыска
      Object.assign(trick, { pitch: 0, pitchT: 0, roll: 0, rollT: 0 });
      shake = 3;
    } else {
      car.stun = 1.1;
      car.vx *= .2; car.vy *= .2;
      trick.pitch = wrapA(trick.pitch); trick.roll = wrapA(trick.roll); trick.pitchT = trick.rollT = 0;
      shake = 9;
      popMoney(t('bad'), '#ff8a80');
      for (let i = 0; i < 14; i++) emit(car.x, 6, car.y, '#ffd27a', 1.5, .4, (Math.random() - .5) * 200, Math.random() * 90, (Math.random() - .5) * 200, 0, 1);
    }
  }

  let camDistS = 0, shakeK = .35;
  const drift = { t: 0, score: 0, off: 0 };
  let shake = 0, camAng = 0, prevFwd = 0, roll = 0, pitch = 0, curFwd = 0, lean = 0;
  // застряли внутри здания, дерева, столба или машины — выталкиваем в ближайшее свободное место
  function unstick(test) {
    for (let r = 3; r <= 240; r += 3) for (let k = 0; k < 24; k++) {
      const a = k / 24 * TAU, x = car.x + Math.cos(a) * r, y = car.y + Math.sin(a) * r;
      const gz = groundHeight(x, y, car.z);
      if (!test(x, y, gz)) { car.x = x; car.y = y; car.z = gz; return true; }
    }
    return false;
  }
  const carHitAt = (x, y, gz) => { const z0 = car.z; car.z = gz; const c = collides(x, y, car.angle); car.z = z0; return c; };
  function update(dt) {
    if (garageOpen || menuOpen || mapOpen) return;
    if (car.onFoot) { walkUpdate(dt); return; }
    if (car.loop) { loopUpdate(dt); return; }
    edgeBounce();
    if (!car.air && collides(car.x, car.y, car.angle) && unstick(carHitAt)) { car.vx *= .3; car.vy *= .3; car.ramp = null; car.stun = 0; }
    if (car.air || car.stun > 0) { airUpdate(dt); return; }
    const { up, down, left, right, brake } = keys;
    const loopPrevX = car.x;
    const fx = Math.cos(car.angle), fy = Math.sin(car.angle);
    let fwd = car.vx * fx + car.vy * fy;
    let lat = -car.vx * fy + car.vy * fx;

    const offroad = isOffroad(car.x, car.y);
    const maxSpeed = offroad ? spec.max * .5 : spec.max;

    if (up) fwd += (fwd < 0 ? 520 : spec.accel * (1 - .5 * Math.max(0, fwd) / maxSpeed)) * dt;
    if (down) fwd -= (fwd > 0 ? 420 : 140) * dt;
    if (!up && !down) fwd -= fwd * Math.min(1, (offroad ? 1.5 : .55) * dt);
    if (brake) fwd -= fwd * Math.min(1, (car.drifting ? .45 : 1.3) * dt);   // в заносе ручник почти не тормозит
    if (fwd > maxSpeed) fwd = Math.max(maxSpeed, fwd - 300 * dt);
    fwd = Math.max(-110, fwd);

    // Руль: плавный, на скорости поворачивает мягче, без газа сам выравнивается
    const target = (left ? -1 : 0) + (right ? 1 : 0);
    car.steer += (target - car.steer) * Math.min(1, (target ? 5 : 9) * dt);
    const sp = Math.abs(fwd);
    const turn = car.steer * spec.turn * Math.min(1, sp / 50) * (1 - .45 * Math.min(1, sp / 300)) * Math.sign(fwd || 1) * (brake ? 1.9 : car.drifting ? 1.35 : 1);
    car.angle += turn * dt;
    {   // скорость не поворачивается вместе с машиной мгновенно — так появляется занос
      const vx0 = fx * fwd - fy * lat, vy0 = fy * fwd + fx * lat, ax = Math.cos(car.angle), ay = Math.sin(car.angle);
      fwd = vx0 * ax + vy0 * ay; lat = -vx0 * ay + vy0 * ax;
    }

    // сцепление: ручник или газ в резком повороте на скорости срывают зад — дрифт
    let grip = offroad ? 7 : spec.grip;
    car.dLock = (car.dLock || 0) - dt;
    if (brake && sp > 60) { grip = 1.2; car.dLock = .8; }
    else if (car.dLock > 0 && car.drifting && Math.abs(car.steer) > .25) grip = 3;
    if (!offroad && up && Math.abs(car.steer) > .55 && sp > 170) grip = Math.min(grip, 3.6);
    const latBefore = lat;
    car.drifting = Math.abs(latBefore) > 45 && sp > 80 && !offroad;
    if (car.drifting && up) fwd += 70 * dt;                    // газ в заносе держит скорость
    if (car.drifting) { drift.t += dt; drift.score += Math.abs(latBefore) * dt * .3; drift.off = 0; }
    else if (drift.t > 0) {
      drift.off += dt;
      if (drift.off > .35) {                                   // дрифт закончился — награда
        if (drift.t > .8) { const rw = Math.max(20, Math.round(drift.score / 10) * 10); save.money += rw; persist(); popMoney(t('drift', { p: fmt(rw) }), '#ff9100'); }
        drift.t = drift.score = 0;
      }
    }
    lat -= lat * Math.min(1, grip * dt);

    const nfx = Math.cos(car.angle), nfy = Math.sin(car.angle);
    car.vx = nfx * fwd - nfy * lat;
    car.vy = nfy * fwd + nfx * lat;

    // на большой скорости за кадр машина проезжает далеко — разрешаем заезжать на склон выше
    climbTol = 12 + Math.hypot(car.vx, car.vy) * dt * .5;
    const nx = car.x + car.vx * dt, ny = car.y + car.vy * dt;
    const blocked = collides(nx, ny, car.angle);
    climbTol = 12;
    if (!blocked) { car.x = nx; car.y = ny; }
    else {
      const impact = Math.hypot(car.vx, car.vy);

          p.shootCd -= dt;

            p.shootCd = .65 + Math.random() * .45; p.aimT = .25;
            const chance = Math.max(.15, Math.min(.8, .8 - od / 650 - pSpeed / 700));
            fireShot(p, car.x, car.y, car.z + (car.onFoot ? 14 : 10), Math.random() < chance);
          }
        }
        p.aimT -= dt;
        p.oz = groundHeight(p.ox, p.oy, p.oz);
        O.root.position.set(p.ox, p.oz, p.oy); O.root.rotation.y = -p.oh; O.root.rotation.z = p.ofall;

            if (sc < bs) { bs = sc; best = [nx, ny]; }

        const dA = angDiff(Math.atan2(ty - p.y, tx - p.x), p.h);

      if (!hit(nx, ny)) { p.x = nx; p.y = ny; p.stuck = Math.max(0, p.stuck - dt); }
      else if (!hit(nx, p.y)) { p.x = nx; p.stuck += dt * .5; }
      else if (!hit(p.x, ny)) { p.y = ny; p.stuck += dt * .5; }

      if (Math.abs((o.z || 0) - car.z) > 20 || o.ghost > 0) continue;
      const dx = car.x - o.x, dy = car.y - o.y, d = Math.hypot(dx, dy);

      if (!collides(px, py, car.angle)) { car.x = px; car.y = py; }

      mode: 'roam', route: null, wi: 1, routeT: 0, withT: 0, comeT: 0, placed: false };   // roam — катается сам, come — едет к тебе, with — с тобой
  });
  const frName = f => (save.friends.names[f.i] || '').trim() || (f.i ? 'Кинан' : 'Армин');
  // случайное место на дороге, где ничего не мешает
  function friendRandomSpot(f) {
    for (let k = 0; k < 30; k++) {
      const line = nodeC(Math.floor(Math.random() * (NB + 1))), along = 500 + Math.random() * (WORLD - 1000), vert = Math.random() < .5;
      const x = vert ? line + 90 : along, y = vert ? along : line + 90, h = vert ? Math.PI / 2 : 0;
      if (Math.hypot(x - car.x, y - car.y) < 700) continue;
      if (corners2(x, y, h, 46, 22).some(([qx, qy]) => solidAtZ(qx, qy, 0))) continue;
      f.x = x; f.y = y; f.h = h; f.v = 0; f.z = groundHeight(x, y, 0); f.route = null; return;
    }
  }
  function friendPlace(f, off) {
    const a = car.angle, fx = Math.cos(a), fy = Math.sin(a), rx = -Math.sin(a), ry = Math.cos(a);
    return [car.x + fx * off[0] + rx * off[1], car.y + fy * off[0] + ry * off[1]];
  }
  function resetFriends(full) {
    for (const f of friends) {
      if (full) { f.mode = 'roam'; f.placed = false; }
      if (f.mode !== 'with') {                      // катается сам по себе — ставим на случайную дорогу (если ещё не стоит)
        if (!f.placed) { friendRandomSpot(f); f.placed = true; f.onFoot = false; if (f.m.driver) f.m.driver.visible = true; }
        continue;
      }
      const V = car.onFoot ? vstate : car, a = V.angle;
      const [ox, oz] = FR_OFF[f.i];
      f.x = V.x + Math.cos(a) * ox - Math.sin(a) * oz; f.y = V.y + Math.sin(a) * ox + Math.cos(a) * oz; f.h = a; f.v = 0; f.z = 0; f.onFoot = false;
    }
  }
  // едем по дорогам к точке (tx, ty) по маршруту навигатора, держимся правой полосы
  function friendSteer(f, dt, maxSp) {
    const hx = Math.cos(f.h), hy = Math.sin(f.h);
    if (!f.route || f.routeT <= 0) {
      if (f.mode === 'roam' && (!f.goal || !f.route)) {          // новая случайная цель: какой-нибудь перекрёсток
        f.goal = [nodeC(Math.floor(Math.random() * (NB + 1))), nodeC(Math.floor(Math.random() * (NB + 1)))];
      }
      if (f.mode === 'come') f.goal = [car.x, car.y];
      f.route = planRoute(roadSpot(f.x, f.y, hx, hy), roadSpot(f.goal[0], f.goal[1]), hx, hy);
      f.wi = 1; f.routeT = f.mode === 'come' ? 1.5 : 1e9;
    }
    f.routeT -= dt;
    const R = f.route, LANE = 90;
    let tx, ty, turnD = Infinity;
    for (;;) {
      const a = R[f.wi - 1], b = R[Math.min(f.wi, R.length - 1)];
      const sl = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / sl, uy = (b[1] - a[1]) / sl;
      tx = b[0] - uy * LANE; ty = b[1] + ux * LANE;            // правая полоса
      const left = (tx - f.x) * ux + (ty - f.y) * uy;             // сколько осталось до конца отрезка
      if (left < 40 && f.wi < R.length - 1) { f.wi++; continue; }
      if (f.wi < R.length - 1) turnD = left;
      if (left < 40 && f.wi >= R.length - 1) {                    // приехали
        if (f.mode === 'roam') { f.route = null; f.goal = null; }
        tx = f.x + hx * 60; ty = f.y + hy * 60; maxSp = 0;
      } else {                                                     // смотрим чуть вперёд вдоль полосы — едем плавно
        const sc = Math.min(0, -left + 120); tx += ux * sc; ty += uy * sc;
      }
      break;
    }
    const dx = tx - f.x, dy = ty - f.y;
    const want = Math.atan2(dy, dx), dA = angDiff(want, f.h);
    if (f.rev > 0) { f.rev -= dt; f.v = -90; f.h -= 1.4 * dt; return; }
    f.h += Math.max(-2.4 * dt, Math.min(2.4 * dt, dA)) * Math.min(1, Math.abs(f.v) / 60 + .3);
    let tsp = maxSp;
    if (turnD < 260) tsp = Math.min(tsp, 110 + turnD * .7);       // тормозим перед поворотом
    if (Math.abs(dA) > .9) tsp = Math.min(tsp, 90);
    f.v += Math.max(-420 * dt, Math.min(220 * dt, tsp - f.v));
  }
  // ты позвонил — друг едет к тебе
  function callFriend(f) {
    if (!save.friends.on) { save.friends.on = true; persist(); renderFriendsMenu(); showMsg(t('frOff'), 1800); }
    const d = Math.hypot(f.x - car.x, f.y - car.y);
    if (d < 300) { f.mode = 'with'; f.withT = 240; showMsg(t('frHere', { n: frName(f) }), 2200); return; }
    f.mode = 'come'; f.route = null; f.routeT = 0; f.comeT = 0; f.onFoot = false; if (f.m.driver) f.m.driver.visible = true;
    showMsg(t('frComing', { n: frName(f) }), 2600);
  }
  function dismissFriend(f, auto) {
    f.mode = 'roam'; f.route = null; f.goal = null; f.placed = true;
    showMsg(t(auto ? 'frLeave' : 'frBye', { n: frName(f) }), 2600);
  }
  function updateFriends(dt) {
    fightT -= dt;
    const on = save.friends.on;
    const rage = people.some(pp => pp.driverOf && !pp.inactive && pp.mode !== 'return' && Math.hypot(pp.x - car.x, pp.y - car.y) < 450);
    const wantFoot = car.onFoot || rage;
    for (const f of friends) {
      f.m.root.visible = on; f.blob.visible = on; f.label.sp.visible = on;
      f.person.root.visible = on && f.onFoot;
      if (!on) continue;
      // --- пешком: вышли вместе с тобой ---
      // режимы: с тобой — ждём таймер; едет к тебе — проверяем, доехал ли
      if (f.mode === 'with') { f.withT -= dt; if (f.withT <= 0 && !f.onFoot && fightT <= 0) dismissFriend(f, true); }
      if (f.mode === 'come') {
        f.comeT += dt;
        const dd = Math.hypot(f.x - car.x, f.y - car.y);
        if (dd < 280 || (dd < 650 && f.route && f.wi >= f.route.length - 1)) { f.mode = 'with'; f.withT = 240; showMsg(t('frHere', { n: frName(f) }), 2200); }
        else if (f.comeT > 50) {                                   // долго не может доехать — появляется сзади (как в GTA, за кадром)
          const [tx, ty] = friendPlace(f, [-520, f.i ? 70 : -70]);
          if (!corners2(tx, ty, car.angle, 46, 22).some(([qx, qy]) => solidAtZ(qx, qy, car.z))) { f.x = tx; f.y = ty; f.h = car.angle; f.z = groundHeight(tx, ty, car.z); }
          f.comeT = 30;
        }
      }
      const fFoot = wantFoot && f.mode === 'with';
      if (fFoot && !f.onFoot) {
        f.onFoot = true; f.v = 0;
        const lx = Math.sin(f.h), ly = -Math.cos(f.h);
        f.px = f.x + lx * 28; f.py = f.y + ly * 28; f.pz = f.z;
        if (f.m.driver) f.m.driver.visible = false;
      } else if (!fFoot && f.onFoot) {
        f.onFoot = false;
        if (f.m.driver) f.m.driver.visible = true;
        if (f.mode === 'with' && Math.hypot(f.x - car.x, f.y - car.y) > 400) { const [tx, ty] = friendPlace(f, FR_OFF[f.i]); f.x = tx; f.y = ty; f.h = car.angle; }
      }
      if (f.onFoot) {
        // помогаем в драке: идём к злому прохожему рядом с тобой
        let enemy = null, ed = fightT > 0 ? 420 : 300;
        for (const pp of people) if (pp.mode === 'fight') { const d = Math.hypot(pp.x - car.x, pp.y - car.y); if (d < ed) { ed = d; enemy = pp; } }
        for (const c of chase.cops) if (c.mode !== 'drive' && !(c.odown > 0)) { const d = Math.hypot(c.ox - car.x, c.oy - car.y); if (d < ed) { ed = d; enemy = { cop: c, x: c.ox, y: c.oy }; } }
        // ты дерёшься с прохожим, а он ещё лежит — друг подбегает и ждёт рядом
        if (!enemy && fightT > 0) for (const pp of people) if (pp.mode === 'down') { const d = Math.hypot(pp.x - car.x, pp.y - car.y); if (d < 200) { enemy = null; f.guard = pp; break; } }
        if (enemy && !f.engaged) { f.engaged = true; showMsg(t('helpYou', { n: (save.friends.names[f.i] || '').trim() || (f.i ? 'Кинан' : 'Армин') }), 1600); }
        if (!enemy && fightT <= 0) f.engaged = false;
        let tx, ty;
        if (enemy) { tx = enemy.x; ty = enemy.y; }
        else if (fightT > 0 && f.guard && f.guard.mode === 'down') { tx = f.guard.x + (f.i ? 18 : -18); ty = f.guard.y; }
        else [tx, ty] = friendPlace(f, FR_FOOT[f.i]);
        const dx = tx - f.px, dy = ty - f.py, d = Math.hypot(dx, dy);
        f.punchT -= dt; f.punchCd -= dt;
        let moving = false;
        if (d > 650) { f.px = tx; f.py = ty; }
        else if (enemy && d < 22) {
          f.ang = Math.atan2(dy, dx);
          if (f.punchCd <= 0) {
            f.punchT = .3; f.punchCd = .6;
            if (enemy.cop) { enemy.cop.odown = 4; enemy.cop.ofall = 0; }
            else {
              enemy.kos = (enemy.kos || 0) + 1;
              enemy.mode = 'down'; enemy.downT = 2.6; enemy.fallA = 0; enemy.punchT = 0;
              enemy.yaw = Math.atan2(f.py - enemy.y, f.px - enemy.x);
            }
            for (let k = 0; k < 8; k++) emit(enemy.x, 20, enemy.y, '#fff59d', 1.4, .3, (Math.random() - .5) * 100, Math.random() * 70, (Math.random() - .5) * 100, 0, 1);
          }
        } else if (d > 5) {
          const sp = Math.min(enemy || fightT > 0 ? 180 : (d > 60 ? 155 : 85), d / dt);
          const nx = f.px + dx / d * sp * dt, ny = f.py + dy / d * sp * dt;
          if (!solidAtZ(nx, ny, f.pz)) { f.px = nx; f.py = ny; }
          else if (!solidAtZ(nx, f.py, f.pz)) f.px = nx; else if (!solidAtZ(f.px, ny, f.pz)) f.py = ny;
          f.ang = Math.atan2(dy, dx); moving = true; f.ph += sp * dt * .16;
        } else f.ang = car.angle;
        f.pz = groundHeight(f.px, f.py, f.pz);
        const P = f.person;
        P.root.position.set(f.px, f.pz, f.py); P.root.rotation.y = -(f.ang ?? car.angle);
        const sw = moving ? Math.sin(f.ph) * .7 : 0;
        P.limbs[0].rotation.z = sw; P.limbs[1].rotation.z = -sw; P.limbs[2].rotation.z = -sw * .8; P.limbs[3].rotation.z = sw * .8;
        if (f.punchT > 0) P.limbs[3].rotation.z = Math.sin((.3 - f.punchT) / .3 * Math.PI) * 1.7;
        f.v *= Math.pow(.02, dt);                              // машина друга стоит
      } else {
        if (f.mode !== 'with') friendSteer(f, dt, f.mode === 'come' ? 330 : 190);
        else {
        // --- в машине: держимся рядом с тобой ---
        const [tx, ty] = friendPlace(f, FR_OFF[f.i]);
        const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy);
        const pv = Math.hypot(car.vx, car.vy);
        if (d > 650 || f.lost > 2.5) {                   // отстал или застрял — догоняет (появляется рядом)
          const ok = !corners2(tx, ty, car.angle, 46, 22).some(([qx, qy]) => solidAtZ(qx, qy, car.z));
          if (ok) { f.x = tx; f.y = ty; f.h = car.angle; f.v = pv; f.z = groundHeight(tx, ty, car.z); f.lost = 0; }
        }
        f.lost = (f.lost || 0) + (d > 220 && f.v < 60 ? dt : -dt); if (f.lost < 0) f.lost = 0;
        const want = d > 30 ? Math.atan2(dy, dx) : car.angle;
        const dA = angDiff(want, f.h);
        if (f.rev > 0) { f.rev -= dt; f.v = -90; f.h += 1.4 * dt; }
        else {
          f.h += Math.max(-2.8 * dt, Math.min(2.8 * dt, dA)) * Math.min(1, Math.abs(f.v) / 50 + .35);
          const ahead = dx * Math.cos(f.h) + dy * Math.sin(f.h);
          let tsp = pv + Math.max(-160, Math.min(280, (d - 12) * 2.2));
          if (ahead < 0) tsp = Math.min(tsp, pv * .6);
          if (Math.abs(dA) > 1.2) tsp *= .5;
          tsp = Math.max(0, Math.min(tsp, Math.max(380, spec.max * 1.25)));
          f.v += Math.max(-520 * dt, Math.min(360 * dt, tsp - f.v));
        }
        }
        const fx = Math.cos(f.h), fy = Math.sin(f.h);
        const nx = f.x + fx * f.v * dt, ny = f.y + fy * f.v * dt;
        const hit = (x, y) => corners2(x, y, f.h, 46, 22).some(([qx, qy]) => solidAtZ(qx, qy, f.z));
        if (!hit(nx, ny)) { f.x = nx; f.y = ny; f.stuck = Math.max(0, f.stuck - dt); }
        else if (!hit(nx, f.y)) { f.x = nx; f.stuck += dt * .5; }
        else if (!hit(f.x, ny)) { f.y = ny; f.stuck += dt * .5; }

        if (f.stuck > 1.2) { f.rev = .6; f.stuck = 0; }
        // не наезжаем на тебя и друг на друга
        for (const o of [car, ...friends.filter(q => q !== f)]) {
          const ox = o === car ? car.x : o.x, oy = o === car ? car.y : o.y;
          const ex = f.x - ox, ey = f.y - oy, ed = Math.hypot(ex, ey);
          if (ed < 44 && ed > .01) { f.x += ex / ed * (44 - ed) * .5; f.y += ey / ed * (44 - ed) * .5; }
        }
        f.z = groundHeight(f.x, f.y, f.z);
      }
      // машина друга

      f.blob.position.set(f.x, f.z + .5, f.y); f.blob.rotation.y = -f.h;
      // имя над головой
      const nm = (save.friends.names[f.i] || '').trim() || (f.i ? 'Кинан' : 'Армин');
      drawLabel(f.label, nm, f.L.color);
      if (f.onFoot) { f.label.sp.position.set(f.px, f.pz + 31, f.py); f.label.sp.scale.set(28, 7, 1); }
      else { f.label.sp.position.set(f.x, f.z + 40, f.y); f.label.sp.scale.set(52, 13, 1); }
    }
  }
  // меню «Друзья»: имена и включение
  const NAME_CHIPS = ['Армин', 'Кинан', 'Гордей', 'Хектор'];
  function renderFriendsMenu() {

  // ================== Мультиплеер (живые игроки) ==================
  // Каждый игрок сообщает, где он и на чём едет; остальные видят его машину с именем.
  // На claude.ai — через «комнату» платформы; на своём сайте — через бесплатные общедоступные MQTT-серверы (без аккаунтов).
  if (typeof save.nick !== 'string' || !save.nick.trim()) { save.nick = t('netGuest') + ' ' + (10 + Math.floor(Math.random() * 90)); persist(); }
  if (typeof save.roomCode !== 'string') save.roomCode = '';
  const net = { room: null, mq: [], state: 'connecting', lastSend: 0, ready: false, id: Math.random().toString(36).slice(2, 10), mqPeers: new Map(), lastMsg: '' };
  const remotes = new Map();
  const esc = v => String(v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const cleanName = v => (typeof v === 'string' && v.replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 16)) || t('netGuest');
  const roomTopic = () => 'mashinki-game/v1/' + ((save.roomCode || '').toLowerCase().replace(/[#+/\s]/g, '').slice(0, 20) || 'city');

  // --- крошечный MQTT-клиент поверх WebSocket (только то, что нужно игре) ---
  const MQ_URLS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
  const enc = new TextEncoder(), dec = new TextDecoder();
  const mqStr = s => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  function mqPacket(type, body) {
    const len = []; let n = body.length;
    do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
    return new Uint8Array([type, ...len, ...body]);
  }
  function mqConnect(url) {
    const c = { url, ws: null, ok: false, buf: new Uint8Array(0), sub: null };
    const open = () => {
      let ws;
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { return; }
      c.ws = ws; ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        const will = roomTopic() + '/p/' + net.id;
        const body = [...mqStr('MQTT'), 4, 0x06, 0, 30, ...mqStr('mk-' + net.id + '-' + Math.random().toString(36).slice(2, 6)), ...mqStr(will), ...mqStr('{"bye":1}')];
        ws.send(mqPacket(0x10, body));
      };
      ws.onmessage = ev => {
        const add = new Uint8Array(ev.data), all = new Uint8Array(c.buf.length + add.length); all.set(c.buf); all.set(add, c.buf.length); c.buf = all;
        while (c.buf.length >= 2) {
          let mult = 1, len = 0, i = 1, d;
          do { if (i >= c.buf.length) return; d = c.buf[i++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);

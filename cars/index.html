    ['lgCoins', '', 'background:#ffd54f;border-radius:50%;width:12px;height:12px;border:2px solid #7a5600'],
    ['lgCar', '', 'background:#1e88e5;border-radius:50%;width:12px;height:12px;border:2px solid #fff'],
    ['lgDest', '📍', ''],
    ['lgRamp', '', 'background:#ff1744;border:2px solid #fff'],
    ['lgBridge', '', 'background:#7e57c2;border:2px solid #fff'],
    ['lgTunnel', '', 'background:#37474f;border:2px solid #ffd54f'],
    ['lgPark', '🌳', 'background:#6cc25f'],
    ['lgLake', '🌊', 'background:#3d9be0'],
    ['lgParking', '🅿️', 'background:#8a919b'],
    ['lgDowntown', '🏢', 'background:#c3cad6'],
    ['lgHomes', '🏠', 'background:#b6da9d'],
    ['lgShops', '🛍️', 'background:#ffcc80'],
  ];
  function renderLegend() {
    document.getElementById('legend').innerHTML = '<h4>' + t('lgTitle') + '</h4>' +
      LEGEND.map(([k, ic, st]) => `<div class="lg"><span class="sw" style="${st}">${ic}</span>${t(k)}</div>`).join('');
  }
  renderLegend(); langHooks.push(renderLegend);
  function drawBigMap(time) {
    const css = bmc.clientWidth; if (!css) return;
    const px = Math.round(css * Math.min(devicePixelRatio || 1, 2));
    if (bmc.width !== px) bmc.width = bmc.height = px;
    const s = px / WORLD;
    bctx.setTransform(s, 0, 0, s, 0, 0);
    bctx.drawImage(baseMap, 0, 0, WORLD, WORLD);
    mapOverlay(bctx, s, true, time);
  }
  mmEl.addEventListener('click', () => toggleMap(true));
  document.getElementById('bmClose').addEventListener('click', () => toggleMap(false));
  document.getElementById('bmClear').addEventListener('click', () => { dest = null; toggleMap(false); });
  bmc.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = bmc.getBoundingClientRect();
    dest = snapToRoad((e.clientX - r.left) / r.width * WORLD, (e.clientY - r.top) / r.height * WORLD);
    showMsg(t('destSet'), 2200);
    toggleMap(false);
  });
  // маяк в месте назначения — видно издалека
  const beacon = new THREE.Group();
  {
    const bm = new THREE.MeshBasicMaterial({ color: '#b44dff', transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(16, 16, 900, 20, 1, true).translate(0, 450, 0), bm); beacon.add(beam);
    const ring = new THREE.Mesh(new THREE.RingGeometry(26, 36, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#b44dff', transparent: true, opacity: .8, depthWrite: false }));
    ring.position.y = 1; beacon.add(ring);
    beacon.visible = false; scene.add(beacon);
  }
  function updateNav(time) {
    updateRoute(time);
    beacon.visible = !!dest;
    if (dest) {
      beacon.position.set(dest[0], groundHeight(dest[0], dest[1], 0), dest[1]);
      beacon.children[1].scale.setScalar(1 + Math.sin(time / 300) * .15);
      if (Math.hypot(car.x - dest[0], car.y - dest[1]) < 110) { dest = null; showMsg(t('arrived'), 2500); }
    }
    // подсказка «сесть в машину»
    const near = car.onFoot && Math.hypot(car.x - vstate.x, car.y - vstate.y) < 60;
    promptEl.classList.toggle('on', near && !menuOpen && !mapOpen);
    if (near && promptEl.textContent !== t('enter')) promptEl.textContent = t('enter');
  }

  // ================== Камера (сзади и чуть сверху) ==================
  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
  function updateCamera(dt, snap = false) {
    let d = car.angle - camAng; d = Math.atan2(Math.sin(d), Math.cos(d));
    camAng += d * (snap ? 1 : Math.min(1, 3.2 * dt));
    const speed = Math.hypot(car.vx, car.vy);
    const footK = car.onFoot ? .55 : 1;
    let dist = (96 + speed * .02) * CAM_K * footK, height = (45 + speed * .01) * CAM_K * footK;
    const cx = Math.cos(camAng), cy = Math.sin(camAng);
    let want = dist;
    for (let t = .2; t <= 1.001; t += .1) {
      if (solidTallAt(car.x - cx * dist * t, car.y - cy * dist * t)) { want = Math.max(car.onFoot ? 24 : 34, dist * (t - .12)); break; }
    }
    if (snap || !camDistS) camDistS = want;
    camDistS += (want - camDistS) * Math.min(1, (want < camDistS ? 10 : 2.5) * dt);   // приближается быстро, отъезжает плавно
    height += (dist - camDistS) * .45; dist = camDistS;
    const tx = car.x - cx * dist, tz = car.y - cy * dist;
    const k = snap ? 1 : Math.min(1, 9 * dt);
    camPos.x += (tx - camPos.x) * k; camPos.z += (tz - camPos.z) * k;
    let camY = height + car.z * .7;
    const ceil = Math.min(ceilingAt(car.x, car.y, car.z), ceilingAt(camPos.x, camPos.z, car.z));
    if (ceil < 1e8) camY = Math.min(camY, ceil - 5);
    camPos.y += (camY - camPos.y) * (ceil < 1e8 ? Math.min(1, 14 * dt) : k);
    camLook.set(car.x + cx * 55 * (car.onFoot ? .5 : 1), (car.onFoot ? 16 : 14) + car.z * .85, car.y + cy * 55 * (car.onFoot ? .5 : 1));
    const sh = shake * shakeK;
    camera.position.set(camPos.x + (Math.random() - .5) * sh, camPos.y + (Math.random() - .5) * sh, camPos.z + (Math.random() - .5) * sh);
    camera.lookAt(camLook);
    const asp = camera.aspect, fov = 60 + speed * .03 + (asp < 1.2 ? (1.2 - asp) * 30 : 0);   // в портрете — шире обзор
    if (Math.abs(camera.fov - fov) > .05) { camera.fov = fov; camera.updateProjectionMatrix(); }
    const snapT = 16, fx = Math.round((car.x + cx * 160) / snapT) * snapT, fz = Math.round((car.y + cy * 160) / snapT) * snapT;
    sun.target.position.set(fx, 0, fz);
    sun.position.set(fx + SUN_OFF.x, SUN_OFF.y, fz + SUN_OFF.z);
  }

  const driftEl = document.getElementById('driftMeter');
  function updateVisuals(dt, t) {
    hpFill.style.width = Math.max(0, Math.round(foot.hp)) + '%';
    const showDrift = drift.t > .35 && !car.onFoot;
    driftEl.classList.toggle('on', showDrift);
    if (showDrift) driftEl.textContent = window.t('driftLive') + ' +' + fmt(Math.max(20, Math.round(drift.score / 10) * 10));
    const V = car.onFoot ? vstate : car;
    player.root.position.set(V.x, V.z, V.y);
    {   // пятно тени под машиной игрока: на земле, бледнеет в прыжке
      const gh = groundHeight(V.x, V.y, V.z);
      playerBlob.position.set(V.x, gh + .5, V.y); playerBlob.rotation.y = -V.angle;
      const k = Math.max(0, 1 - (V.z - gh) / 120); playerBlob.material.opacity = k; playerBlob.scale.setScalar(spec.kind === 'moto' ? .6 + .4 * k : 1);
    }
    if (car.onFoot) {
      foot.root.position.set(car.x, car.z, car.y); foot.root.rotation.y = -car.angle;
      const sw = Math.sin(foot.ph) * (Math.hypot(car.vx, car.vy) > 1 ? .7 : 0);
      foot.limbs[0].rotation.z = sw; foot.limbs[1].rotation.z = -sw; foot.limbs[2].rotation.z = -sw * .8; foot.limbs[3].rotation.z = sw * .8;
      if (foot.punchT > 0) foot.limbs[3].rotation.z = Math.sin((.3 - foot.punchT) / .3 * Math.PI) * 1.7;   // удар правой
      poseWeapon();
      foot.root.rotation.z = foot.ko > 0 ? Math.min(Math.PI / 2, (2.4 - foot.ko) * 6) : 0;                    // нокаут — падает
      hpFill.style.width = Math.round(foot.hp) + '%';
      const fg = groundHeight(car.x, car.y, car.z);
      footBlob.position.set(car.x, fg + .5, car.y); footBlob.material.opacity = Math.max(0, .9 - (car.z - fg) / 60);
    } else if (car.loop) slopePitch = 0;
    else if (!car.air) {
      const fx = Math.cos(car.angle) * 20, fy = Math.sin(car.angle) * 20;
      const target = Math.atan2(groundHeight(car.x + fx, car.y + fy) - groundHeight(car.x - fx, car.y - fy), 40);
      slopePitch += (target - slopePitch) * Math.min(1, 14 * dt);
    } else slopePitch += (0 - slopePitch) * Math.min(1, 1.5 * dt);
    player.tg.rotation.z = slopePitch + trick.pitch;
    player.tg.rotation.x = trick.roll + (spec.kind === 'moto' ? lean : 0);   // мотоцикл наклоняется в поворот
    player.root.rotation.y = -V.angle;
    player.body.rotation.x = spec.kind === 'moto' ? 0 : roll;
    player.body.rotation.z = pitch;
    for (const w of player.wheels) w.rotation.z -= curFwd * dt / player.r;
    for (const pv of player.pivots) if (pv.position.x > 0) pv.rotation.y = -car.steer * .5;
    player.tailMat.emissiveIntensity = (keys.down || keys.brake) ? 2.5 : .3;

    for (const c of coins) if (!c.taken) {
      c.mesh.rotation.y = t / 400 + c.ph;
      c.mesh.position.y = c.z + Math.sin(t / 300 + c.ph) * 2.5;
    }

    let best = null, bd = Infinity;
    for (const c of coins) if (!c.taken) { const d = Math.hypot(c.x - car.x, c.y - car.y); if (d < bd) { bd = d; best = c; } }
    let target = best && bd > 200 ? [best.x, best.y] : null;
    if (dest) {                                            // к метке на карте — по дорогам
      const rp = routePoints();
      target = rp.slice(1).find(pt => Math.hypot(pt[0] - car.x, pt[1] - car.y) > 90) || dest;
    }
    arrowMesh.visible = !!target && !menuOpen;
    arrowMesh.material.color.set(dest ? '#b44dff' : '#ffd54f'); arrowMesh.material.emissive.set(dest ? '#6a1b9a' : '#ffb300');
    if (target) {
      const a = Math.atan2(target[1] - car.y, target[0] - car.x);
      arrowMesh.position.set(car.x, car.z + (car.onFoot ? 34 : 30) + Math.sin(t / 250) * 1.2, car.y);
      arrowMesh.rotation.set(0, -a, 0);
    }

    for (const p of parts) {
      if (p.life <= 0) { p.s.visible = false; continue; }
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.vx *= .95; p.vz *= .95; p.vy *= .95;
      p.size += p.grow * dt;
      p.s.position.set(p.x, p.y, p.z);
      p.s.scale.set(p.size * 2, p.size * 2, 1);
      p.s.material.opacity = Math.max(0, p.life / p.max) * p.alpha;
    }
  }

  // ================== Спидометр ==================
  const sp = document.getElementById('speedo'), sctx = sp.getContext('2d');
  function drawSpeedo() {
    const dpr = Math.min(devicePixelRatio || 1, 2), css = sp.clientWidth || 180, px = Math.round(css * dpr);
    if (sp.width !== px) { sp.width = sp.height = px; }
    sctx.setTransform(px / 180, 0, 0, px / 180, 0, 0);       // рисуем в координатах 180×180, масштаб — под размер экрана
    sctx.clearRect(0, 0, 180, 180);
    const speed = Math.hypot(car.vx, car.vy) * .33;
    const cx = 90, cy = 88, r = 72, a0 = Math.PI * .75, a1 = Math.PI * 2.25, max = 200;
    sctx.fillStyle = 'rgba(15,20,28,.6)'; sctx.beginPath(); sctx.arc(cx, cy, r + 10, 0, 7); sctx.fill();
    sctx.lineWidth = 8; sctx.lineCap = 'round';
    sctx.strokeStyle = 'rgba(255,255,255,.12)'; sctx.beginPath(); sctx.arc(cx, cy, r - 6, a0, a1); sctx.stroke();
    const f = Math.min(1, speed / max);
    const g = sctx.createLinearGradient(cx - r, cy, cx + r, cy);
    g.addColorStop(0, '#4fc3f7'); g.addColorStop(.6, '#ffd54f'); g.addColorStop(1, '#ff5252');
    sctx.strokeStyle = g; sctx.beginPath(); sctx.arc(cx, cy, r - 6, a0, a0 + (a1 - a0) * f); sctx.stroke();
    sctx.lineWidth = 2; sctx.strokeStyle = 'rgba(255,255,255,.6)';
    for (let i = 0; i <= 6; i++) {
      const a = a0 + (a1 - a0) * i / 6;
      sctx.beginPath(); sctx.moveTo(cx + Math.cos(a) * (r - 18), cy + Math.sin(a) * (r - 18)); sctx.lineTo(cx + Math.cos(a) * (r - 25), cy + Math.sin(a) * (r - 25)); sctx.stroke();
    }
    const na = a0 + (a1 - a0) * f;
    sctx.strokeStyle = '#ff5252'; sctx.lineWidth = 3;
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(na) * (r - 20), cy + Math.sin(na) * (r - 20)); sctx.stroke();
    sctx.fillStyle = '#fff'; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.font = 'bold 26px "Segoe UI", sans-serif'; sctx.fillText(Math.round(speed), cx, cy + 26);
    sctx.font = '11px "Segoe UI", sans-serif'; sctx.fillStyle = 'rgba(255,255,255,.7)'; sctx.fillText(t('kmh'), cx, cy + 46);
    sctx.fillStyle = '#ddd'; sctx.beginPath(); sctx.arc(cx, cy, 5, 0, 7); sctx.fill();
  }

  // ================== Цикл ==================
  const coinsEl = document.getElementById('coins'), moneyEl = document.getElementById('money');
  const clockEl = document.getElementById('clock'), clockPill = document.getElementById('clockPill');
  let clockTxt = '';
  function updateClock() {
    const h = NIGHT.hour, hh = Math.floor(h), mm = Math.floor((h - hh) * 6) * 10;
    const txt = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    if (txt !== clockTxt) { clockTxt = txt; clockEl.textContent = txt; clockPill.firstChild.textContent = (h > 6.5 && h < 19.5 ? '☀️' : '🌙') + ' '; }
  }
  clockPill.style.cursor = 'pointer'; clockPill.style.pointerEvents = 'auto';
  clockPill.addEventListener('click', nightToggle);
  addEventListener('keydown', (e) => { if (e.code === 'KeyN' && !e.repeat && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) nightToggle(); });
  const popEl = document.getElementById('pop');
  function popMoney(text, color) {
    popEl.textContent = text; popEl.style.color = color;
    popEl.classList.remove('show'); void popEl.offsetWidth; popEl.classList.add('show');
  }
  const onResize = () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  };
  addEventListener('orientationchange', () => setTimeout(onResize, 300));
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  });
  newGame();
  const goBtn = document.getElementById('goBtn');
  window.__gameReady = true; goBtn.classList.remove('wait'); applyLang();
  setTimeout(() => document.getElementById('help').style.opacity = .35, 12000);

  let last = performance.now();
  function loop(t) {
    const dt = Math.min(.033, (t - last) / 1000);
    last = t;
    const subs = dt > .018 ? 2 : 1;                       // когда игра подтормаживает — считаем движение мелкими шагами, чтобы не пролетать сквозь стены
    for (let i = 0; i < subs; i++) update(dt / subs);
    if (!garageOpen) { updateTraffic(dt); drawTraffic(); updatePeople(dt); }
    if (!garageOpen && !menuOpen && !mapOpen) { updatePolice(dt, t); collideVehicles(); updateFriends(dt); updateWeapons(dt); }
    netUpdate(dt, t);
    updateNav(t); drawMinimap(t); if (mapOpen) drawBigMap(t);
    if (menuOpen) { menuCamera(dt); updateMenuInfo(); } else updateCamera(dt);
    updateVisuals(dt, t);
    updateDayNight(dt); updateClock(); updateHomeLights(); updateShops(t);
    for (const d of homeDoors) {                         // двери сами открываются, когда ты рядом (пешком или на машине)
      const want = Math.hypot(car.x - d.x, car.y - d.y) < d.r || Math.hypot(vstate.x - d.x, vstate.y - d.y) < 20 ? 1 : 0;
      d.k += Math.sign(want - d.k) * Math.min(Math.abs(want - d.k), dt * 2.5);
      const e = d.k * d.k * (3 - 2 * d.k); d.obj.rotation[d.axis] = e * d.max;
    }
    renderFrame();
    coinsEl.textContent = collected;
    moneyEl.textContent = fmt(save.money);
    drawSpeedo();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
